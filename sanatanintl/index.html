<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>sanatanintl.org — Coming Soon</title>
    <style>
      /* Minimal, centered full-page notice */
      :root {
        --bg: #0f1720;
        --card: #0b1220;
        --text: #e6eef8;
        --muted: #98a0b0;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        text-align: center;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
        padding: 36px 48px;
        border-radius: 12px;
        box-shadow: 0 6px 30px rgba(2, 6, 23, 0.6);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.03);
        max-width: 90ch;
      }
      h1 {
        margin: 0;
        font-weight: 600;
        letter-spacing: 0.02em;
        font-size: clamp(24px, 5vw, 48px);
      }
      p.sub {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: clamp(12px, 2.2vw, 15px);
      }
      .domain {
        display: block;
        margin-top: 14px;
        font-weight: 700;
        font-size: clamp(18px, 3.6vw, 28px);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" role="status" aria-live="polite">
        <h1>Website incoming</h1>
        <span class="domain">sanatanintl.org</span>
        <p class="sub">We're setting things up. Check back soon.</p>
      </div>
    </div>
  </body>
</html>
